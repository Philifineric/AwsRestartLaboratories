import boto3
import json

# Define the CloudFormation template
template = {
    "AWSTemplateFormatVersion": "2010-09-09",
    "Description": "Create VPC, IGW, Security Group, Private Subnet, and EC2 instance",
    "Resources": {
        "MyVPC": {
            "Type": "AWS::EC2::VPC",
            "Properties": {
                "CidrBlock": "10.0.0.0/16",
                "EnableDnsSupport": True,
                "EnableDnsHostnames": True,
                "Tags": [{"Key": "Name", "Value": "MyVPC"}]
            }
        },
        "MyInternetGateway": {
            "Type": "AWS::EC2::InternetGateway",
            "Properties": {
                "Tags": [{"Key": "Name", "Value": "MyInternetGateway"}]
            }
        },
        "AttachGateway": {
            "Type": "AWS::EC2::VPCGatewayAttachment",
            "Properties": {
                "VpcId": {"Ref": "MyVPC"},
                "InternetGatewayId": {"Ref": "MyInternetGateway"}
            }
        },
        "MySecurityGroup": {
            "Type": "AWS::EC2::SecurityGroup",
            "Properties": {
                "GroupDescription": "Allow SSH access from anywhere",
                "VpcId": {"Ref": "MyVPC"},
                "SecurityGroupIngress": [{
                    "IpProtocol": "tcp",
                    "FromPort": 22,
                    "ToPort": 22,
                    "CidrIp": "0.0.0.0/0"
                }],
                "Tags": [{"Key": "Name", "Value": "SSHAccess"}]
            }
        },
        "MyPrivateSubnet": {
            "Type": "AWS::EC2::Subnet",
            "Properties": {
                "VpcId": {"Ref": "MyVPC"},
                "CidrBlock": "10.0.1.0/24",
                "AvailabilityZone": {"Fn::Select": [0, {"Fn::GetAZs": ""}]},
                "Tags": [{"Key": "Name", "Value": "MyPrivateSubnet"}]
            }
        },
        "MyEC2Instance": {
            "Type": "AWS::EC2::Instance",
            "Properties": {
                "InstanceType": "t3.micro",
                "ImageId": "ami-0c94855ba95c71c99",  # Example Amazon Linux 2 AMI
                "SubnetId": {"Ref": "MyPrivateSubnet"},
                "SecurityGroupIds": [{"Ref": "MySecurityGroup"}],
                "Tags": [{"Key": "Name", "Value": "MyEC2Instance"}]
            }
        }
    }
}

# Convert template to JSON
template_body = json.dumps(template)

# Create CloudFormation client (specify region)
cf_client = boto3.client('cloudformation', region_name='us-east-1')

# Create the stack
response = cf_client.create_stack(
    StackName='MyVPCStack',
    TemplateBody=template_body,
    Capabilities=['CAPABILITY_NAMED_IAM']
)

print("Stack creation initiated. Stack ID:")
print(response['StackId'])